name: Generator-Test

# Erzeugt ein Projekt aus der offiziellen NeoForge-Vorlage, legt Beispiel-Blöcke
# und -Items mit dem Inhalte-Generator an und kompiliert alles mit Gradle.
# So fällt sofort auf, wenn eine Vorlage nicht zu einer Minecraft-Version passt.
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/src/content.rs"
      - "src-tauri/src/template.rs"
      - "src-tauri/src/mcassets.rs"
      - ".github/workflows/generator-test.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.1", "1.21.4", "1.21.10"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux-Bibliotheken für Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: NeoForge-Vorlage laden
        run: |
          git clone --depth 1 https://github.com/NeoForgeMDKs/MDK-${{ matrix.mc }}-ModDevGradle mdk-src
          mkdir -p zipdir && mv mdk-src zipdir/MDK-main && rm -rf zipdir/MDK-main/.git
          (cd zipdir && zip -qr ../mdk.zip .)

      - name: Projekt anlegen und Inhalte erzeugen
        working-directory: src-tauri
        run: |
          mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
          ANVIL_TEST_MDK=$GITHUB_WORKSPACE/mdk.zip cargo test customize_mdk -- --nocapture
          ANVIL_TEST_PROJECT=/tmp/anvil-test-project ANVIL_TEST_MC=${{ matrix.mc }} cargo test generate_into_mdk -- --nocapture

      - name: Mit Gradle kompilieren
        working-directory: /tmp/anvil-test-project
        run: |
          chmod +x gradlew
          ./gradlew compileJava processResources --no-daemon --console=plain

  catalog:
    # Lädt den echten Minecraft-Client und prüft den Block-/Item-Katalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.1", "1.21.4", "1.21.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux-Bibliotheken für Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Katalog bauen und prüfen
        working-directory: src-tauri
        run: |
          mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
          ANVIL_TEST_CATALOG=${{ matrix.mc }} cargo test real_catalog -- --nocapture
