name: Workshop-Server
on:
  push:
    paths: ["workshop-server/**", ".github/workflows/workshop-server.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workshop-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: docker build -t anvil-workshop .
