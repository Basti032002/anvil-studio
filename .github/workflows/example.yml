name: Beispiel-Mod

# Kompiliert die Beispiel-Mod (examples/rubinwerk) und startet einen Server,
# damit sie für alle, die sie herunterladen, wirklich funktioniert.
on:
  push:
    branches: [main]
    paths: ["examples/**", ".github/workflows/example.yml"]
  workflow_dispatch:

jobs:
  rubinwerk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Kompilieren
        working-directory: examples/rubinwerk
        run: |
          chmod +x gradlew
          ./gradlew compileJava processResources --no-daemon --console=plain
      - name: Server starten
        working-directory: examples/rubinwerk
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          ./gradlew runServer --no-daemon --console=plain > server.log 2>&1 &
          PID=$!
          for i in $(seq 1 180); do
            if grep -q 'Done (' server.log; then break; fi
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 5
          done
          kill $PID 2>/dev/null || true
          pkill -f 'net.neoforged' 2>/dev/null || true
          if ! grep -qE 'Done \(' server.log; then
            cat run/crash-reports/*.txt 2>/dev/null | head -120
            grep -iE "error|exception|failed" server.log | head -60
            exit 1
          fi
          if grep -iE "(error|exception|failed|couldn't).*rubinwerk" server.log; then exit 1; fi
          echo "Server läuft mit Rubinwerk."
