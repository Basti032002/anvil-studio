name: Windows-Build

# Push auf main  → Installer als Artefakt
# Tag v1.2.3     → zusätzlich GitHub-Release (daraus holt sich Anvil Studio seine Updates)
# Tag v1.2.3-beta.1 → Release als Vorabversion
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version prüfen (Tag = tauri.conf.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$APP" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur App-Version $APP. Erst 'node scripts/version.mjs $TAG' ausführen."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: anvil-studio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: GitHub-Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            src-tauri/target/release/bundle/nsis/*-setup.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            --title "Anvil Studio ${GITHUB_REF_NAME#v}" \
            --generate-notes $PRE
