name: Windows-Build

# Push auf main  → Installer als Artefakt. Gibt es für die Version aus
#                  tauri.conf.json noch kein Release, wird es automatisch
#                  erstellt (Tag v<Version>) – daraus holt sich Anvil Studio
#                  seine Updates.
# Version mit Bindestrich (z. B. 1.2.3-beta.1) → Release als Vorabversion.
# Ein manuell gepushter Tag v* funktioniert ebenfalls.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version prüfen (Tag = tauri.conf.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$APP" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur App-Version $APP. Erst 'node scripts/version.mjs $TAG' ausführen."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: anvil-studio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: GitHub-Release erstellen (falls neue Version)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v$APP"
          if [[ "$GITHUB_REF" == refs/heads/* && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Kein Release für Branch $GITHUB_REF_NAME"; exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits – nichts zu tun."; exit 0
          fi
          PRE=""
          if [[ "$APP" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "$TAG" \
            src-tauri/target/release/bundle/nsis/*-setup.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            --target "$GITHUB_SHA" \
            --title "Anvil Studio $APP" \
            --generate-notes $PRE
