name: Windows-Build

# Push auf main  → Installer als Artefakt. Gibt es für die Version aus
#                  tauri.conf.json noch kein Release, wird es automatisch
#                  erstellt (Tag v<Version>) – daraus holt sich Anvil Studio
#                  seine Updates.
# Version mit Bindestrich (z. B. 1.2.3-beta.1) → Release als Vorabversion.
# Ein manuell gepushter Tag v* funktioniert ebenfalls.
#
# Kanäle:
#   1.2.3          → stabil, öffentliches Repo RELEASE_REPO
#   1.2.3-beta.1   → Beta (Pre-Release), öffentliches Repo RELEASE_REPO
#   1.2.3-dev.1    → Dev, PRIVATES Repo DEV_REPO (nur eingeladene Tester)
# Dafür wird das Secret RELEASES_TOKEN gebraucht: ein Fine-grained Token mit
# „Contents: Read and write“ für RELEASE_REPO und DEV_REPO.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_REPO: Basti032002/anvil-studio-releases
  DEV_REPO: Basti032002/anvil-studio-dev

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # für die Änderungsliste im Release

      - name: Version prüfen (Tag = tauri.conf.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$APP" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur App-Version $APP. Erst 'node scripts/version.mjs $TAG' ausführen."
            exit 1
          fi

      - name: Client-ID für den Admin-Login prüfen
        shell: bash
        env:
          ANVIL_GITHUB_CLIENT_ID: ${{ vars.ANVIL_GITHUB_CLIENT_ID }}
        run: |
          if [ -z "$ANVIL_GITHUB_CLIENT_ID" ]; then
            echo "::error::Repo-Variable ANVIL_GITHUB_CLIENT_ID fehlt (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          echo "Client-ID vorhanden (${ANVIL_GITHUB_CLIENT_ID:0:6}…)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run tauri build
        env:
          # Client-ID der GitHub-OAuth-App für den Admin-Login (Repo-Variable)
          ANVIL_GITHUB_CLIENT_ID: ${{ vars.ANVIL_GITHUB_CLIENT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: anvil-studio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Release veröffentlichen (falls neue Version)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret RELEASES_TOKEN fehlt – es wird kein Release veröffentlicht."
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/heads/* && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Kein Release für Branch $GITHUB_REF_NAME"; exit 0
          fi
          APP=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v$APP"
          if [[ "$APP" == *-dev* ]]; then TARGET="$DEV_REPO"; else TARGET="$RELEASE_REPO"; fi
          echo "Ziel-Repo: $TARGET"
          if gh release view "$TAG" --repo "$TARGET" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits – nichts zu tun."; exit 0
          fi

          # Änderungen seit dem letzten Release (dessen Commit steht in der Beschreibung)
          PREV=$(gh release view --repo "$TARGET" --json body --jq .body 2>/dev/null | grep -oE 'Commit: [0-9a-f]{40}' | head -1 | cut -d' ' -f2 || true)
          if [ -n "$PREV" ] && git cat-file -e "$PREV" 2>/dev/null; then RANGE="$PREV..HEAD"; else RANGE="-n 15 HEAD"; fi
          BODY=$(git log -1 --pretty=%b)
          {
            if [ -n "$BODY" ]; then echo "$BODY"; echo; fi
            echo "## Änderungen"
            git log $RANGE --no-merges --pretty='- %s' | grep -vE '^- Version [0-9.]+(-[0-9A-Za-z.]+)?$' || true
            echo
            echo "<sub>Commit: $GITHUB_SHA</sub>"
          } > notes.md
          cat notes.md

          PRE=""
          if [[ "$APP" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "$TAG" \
            src-tauri/target/release/bundle/nsis/*-setup.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            --repo "$TARGET" \
            --title "Anvil Studio $APP" \
            --notes-file notes.md $PRE
