[package]
name = "anvil-studio"
version = "0.5.0-dev.4"
description = "Anvil Studio – Launcher zum Erstellen und Testen von Minecraft-Mods"
edition = "2021"

[lib]
name = "anvil_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
trash = "5"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "http2", "json"] }
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
walkdir = "2"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
